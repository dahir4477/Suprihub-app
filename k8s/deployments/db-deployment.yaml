apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
  labels:
    app: dispatch-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatch-db
  template:
    metadata:
      labels:
        app: dispatch-db
    spec:
      containers:
        - name: postgres
          image: dispatch-db:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dispatch-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dispatch-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: dispatch-db-secret
                  key: POSTGRES_DB
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: dispatch-db-pvc
