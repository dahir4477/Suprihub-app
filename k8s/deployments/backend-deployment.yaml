apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: dispatch-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dispatch-backend
  template:
    metadata:
      labels:
        app: dispatch-backend
    spec:
      containers:
        - name: backend
          image: dispatch-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: dispatch-backend-config
                  key: PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: dispatch-backend-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: dispatch-backend-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: dispatch-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dispatch-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: dispatch-db-secret
                  key: POSTGRES_DB
